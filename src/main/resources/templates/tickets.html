<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meus chamados | NRS Norte</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="topbar"><a class="brand" th:href="@{/tickets}">✚ <span>Suporte de TI <small>NRS Norte</small></span></a><div class="user-area"><span sec:authentication="name"></span><form th:action="@{/logout}" method="post"><button class="link-button">Sair</button></form></div></header>
<main class="container"><div class="page-heading"><div><p class="eyebrow">PAINEL DE ATENDIMENTO</p><h1>Meus chamados</h1><p class="muted">Consulte e acompanhe suas solicitações de suporte.</p></div><a class="button" th:href="@{/tickets/new}">+ Novo chamado</a></div>
<div th:if="${param.created}" class="alert success" role="status">Chamado registrado com sucesso.</div>
<div class="table-wrap"><table><thead><tr><th>Protocolo</th><th>Categoria</th><th>Descrição</th><th>Prioridade</th><th>Status</th><th>Ação</th></tr></thead><tbody><tr th:each="t : ${tickets}"><td th:text="${t.protocol}"></td><td th:text="${t.category}"></td><td class="description" th:text="${t.description}"></td><td><span class="priority" th:text="${t.priority}"></span></td><td><span class="status" th:text="${t.status}"></span></td><td><a th:href="@{/tickets/{id}(id=${t.id})}">Visualizar</a></td></tr><tr th:if="${#lists.isEmpty(tickets)}"><td colspan="6" class="empty">Nenhum chamado registrado. Selecione “Novo chamado” para começar.</td></tr></tbody></table></div></main></body></html>
