<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalhes do chamado</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="topbar"><a class="brand" th:href="@{/tickets}">✚ <span>Suporte de TI <small>NRS Norte</small></span></a><a class="link-button" th:href="@{/tickets}">Voltar aos chamados</a></header>
<main class="container narrow"><p class="eyebrow">ACOMPANHAMENTO</p><h1>Detalhes do chamado</h1><section class="card detail"><p><strong>Protocolo:</strong> <span th:text="${ticket.protocol}"></span></p><p><strong>Categoria:</strong> <span th:text="${ticket.category}"></span></p><p><strong>Prioridade:</strong> <span th:text="${ticket.priority}"></span></p><p><strong>Status:</strong> <span th:text="${ticket.status}"></span></p><p><strong>Solicitante:</strong> <span th:text="${ticket.requester}"></span></p><p><strong>Descrição:</strong></p><p th:text="${ticket.description}"></p><p><strong>Data:</strong> <span th:text="${#temporals.format(ticket.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p></section><a class="button" th:href="@{/tickets}">Voltar à listagem</a></main></body></html>
